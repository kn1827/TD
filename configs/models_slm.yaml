# Small language models (SLM) for heterogeneous debates: every agent of a debate is a different family.
#
# Selection rules (plans/chon_agent_khac_ho.md):
#   1. a different developer AND an independent pre-training (no fine-tune / distillation of another
#      family in the list);
#   2. instruct, non-reasoning model of 2-5B parameters, run in float16 (T4 has no bfloat16; no FP8);
#   3. NOT gated: downloadable without requesting access (no HF token needed);
#   4. architecture supported by vLLM, standard attention, context >= 8192 tokens, safetensors weights;
#   5. rank = Hugging Face downloads over the last 30 days of the model's official repo (09/10/2026);
#      setups take the top 3 / top 6 / all 12 (configs/exp.yaml).
# Facts below were read from the Hugging Face API on 09/10/2026 (revision = commit pinned that day).
#
# Fields: hf_id, revision, family/developer, params (safetensors metadata), layers, kv_heads,
# head_dim (KV-cache size), ctx (max_position_embeddings), license, trust_remote_code.

