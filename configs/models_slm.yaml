# Considered and excluded (plans/chon_agent_khac_ho.md):
#   gated (need an access request): meta-llama/* (official repo; the Unsloth re-upload is used instead),
#     google/gemma-* (also: vLLM refuses Gemma 3 in fp16), CohereLabs/*, naver-hyperclovax/*.
#   Mistral: Ministral-3-3B ships FP8 weights (T4 cannot run FP8); no other ungated Mistral model <= 5B.
#   MiniCPM3-4B: only pytorch_model.bin (pickle) + remote code.  SmolLM3-3B: hybrid reasoning.
#   Context 4096 (too short for 6 agents reading 5 peers): OLMo-2-1B, Nemotron-Mini-4B, StableLM-2-1.6B,
#     Instella-3B, EuroLLM-1.7B, llm-jp-3-3.7B, Zamba2-2.7B.
#   Qwen2.5-3B: same family as Qwen3-4B.  Granite-4.0-micro: same family as Granite 3.3.
