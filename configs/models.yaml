# Model families for heterogeneous debates: every agent of a debate is a different family.
# 7-9B instruct models, all downloadable WITHOUT an access request (no gated repo, no HF token needed).
# The small-model alternative (2-5B, faster) is configs/models_slm.yaml (configs/exp_slm.yaml).
#
# Selection rules (plans/chon_agent_khac_ho.md):
#   1. a different developer AND an independent pre-training (no fine-tune / distillation of another
#      family in the list);
#   2. instruct, non-reasoning model of 7-9B parameters (size class of Choi et al.), run in float16;
#   3. NOT gated; safetensors weights;
#   4. architecture supported by vLLM; context >= 8192 tokens;
#   5. rank = Hugging Face downloads over the last 30 days of the model's official repo (09/10/2026);
#      setups take the top 3 / top 6 / all 12 (configs/exp.yaml).
