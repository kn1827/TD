# Candidate models for TD-MAD on Kaggle "GPU T4 x2" (2 x 16 GB, compute 7.5: fp16 only, no bf16/fp8).
#
# hf_id      exact name vLLM serves (must match `--model` in kaggle/start_vllm.sh)
# revision   HF commit served (start_vllm.sh --revision), pinned 05/10/2026 for the official run
# chat_template_kwargs  sent with every request: fixes template variables that would otherwise
#            change between sessions (Llama 3.x writes today's date into its system header)
# weights_gb size of the safetensors in the repo (checked on HuggingFace 05/10/2026)
# layers / kv_heads / head_dim  -> KV cache bytes per token = 2 * layers * kv_heads * head_dim * 2
# t4         proven = ran on Kaggle T4 in DUS (24-25/09/2026) | ok = same arch as a proven model or
#            standard Llama/Qwen arch, not run yet | risky = fits but slow/tight | no = does not run
# Used by tdmad/costmodel.py (scripts/estimate_budget.py) and by the run scripts (hf_id).

