# Not usable on Kaggle T4 (kept here so the reason is written down):
#   Gemma-2 / Gemma-3   vLLM refuses fp16 ("numerical instability"), T4 has no bf16, fp32 does not fit
#   Ministral-3 (2512)  FP8 weights + vision tower; FP8 needs compute >= 8.9
#   OLMo-2-7B           no GQA: 512 KB/token KV cache and 14.6 GB fp16 weights
