# TD-MAD v2 — pilot for gate G1 (31/10/2026). See EXPERIMENT_G1.md.
# G1 checks feasibility only: (1) >= 40 valid trap items per model, (2) split-half reliability
# of pi >= 0.8, (3) D-level labels recognised by annotators >= 85% and Cohen's kappa >= 0.7,
# (4) cost per call within +-30% of the estimate below. Pilot data never enters confirmatory tests.

run_name: g1_pilot
models_file: configs/models.yaml
data_dir: data
results_dir: results

# Two lanes = two T4s, each with its own vLLM server and its own Python driver (kaggle/run_g1.sh).
lanes:
  lane0:
    gpu: 0
    port: 8001
    model: qwen2.5-7b          # 7-8B slot (proven on Kaggle T4 in DUS)
    pools: [qwen7-homo]
  lane1:
    gpu: 1
    port: 8002
    model: llama3.2-3b         # 3-4B slot, other family. Ungated fallback: qwen2.5-3b
    pools: [llama3-homo]
    generators: [phi-4, mistral-7b]   # D1/D2 message writers, outside the pool, two families

# OpenAI-compatible endpoints per model key. Several URLs = replicas (requests are round-robined).
servers:
  qwen2.5-7b: [http://localhost:8001/v1]
  llama3.2-3b: [http://localhost:8002/v1]
  qwen2.5-3b: [http://localhost:8002/v1]
  phi-4: [http://localhost:8002/v1]
  mistral-7b: [http://localhost:8002/v1]

# Items: every task is split once (seeded) into pilot / nc1 / nc23 / reserve (scripts/prepare_data.py).
data:
  split_seed: 20261005
  n_pilot: 200                 # pilot items per natural task
  fractions: {nc1: 0.45, nc23: 0.40, reserve: 0.15}
  traps:
    n_numeric: 60              # CRT-style and modified-classic templates (answers computed in code)
    n_misconception: 40        # TruthfulQA MC1, misconception categories
    seed: 7

# Sampling of every pool-model generation: S1 CoT samples AND every debate turn. One block on
# purpose: pi must be the distribution of round-0 answers, and assigned round-0 starts are S1
# samples. Du et al. used the API default (temperature 1); 0.7 is the plan's value for CoT
# sampling (NC1 step 1). max_tokens is a cap well above a normal solution (~200-400 tokens), so
# almost no answer is cut; the cut share is reported (truncated_rate).
sampling:
  temperature: 0.7
  top_p: 1.0
  max_tokens: 1024

# S1 — screening + plausibility pi (plan, NC1 steps 1-2)
screen:
  split: pilot
  tasks: {gsm8k_platinum: 150, commonsenseqa: 150, traps_pilot: 100}
  n_samples: {number: 30, letter: 20}   # first 10 = screening sample; all = pi (beta-binomial)
  logprob_perms: 4             # MC: direct-answer letter probabilities over 4 option orders
  concurrency: 8               # requests in flight per server (each carries n samples)

# S2 — multi-agent debate of Du et al. (2023) on a read graph, T = 5 rounds after round 0
mad:
  split: pilot
  tasks: {gsm8k_platinum: 100, commonsenseqa: 100, traps_pilot: 100}
  graphs: [complete6, ring6]   # Block A graphs; heawood14 / rr3_14 / cluster3_14 are ready for Block B
  graph_seed: 3
  rounds: 5
  memory: last_round           # last_round | full (Du's whole chat): see tdmad/mad.py
  seeds: [1]
  init: natural                # natural | assigned (round 0 drawn from the model's own screening samples)
  q0_levels: [0.33, 0.5, 0.67] # used only with init: assigned
  concurrency: 64              # agent calls in flight per pool
  pools:
    qwen7-homo:
      agents: {qwen2.5-7b: 6}
      gpus: 1
    llama3-homo:
      agents: {llama3.2-3b: 6}
      gpus: 1
    mixed:                     # Block A "mixed families": needs both servers, run after the lanes
      agents: [qwen2.5-7b, llama3.2-3b, qwen2.5-7b, llama3.2-3b, qwen2.5-7b, llama3.2-3b]
      gpus: 2
      enabled: false

# S3 — D0-D3 messages for the annotation check (criterion 3)
messages:
  split: pilot
  items: {gsm8k_platinum: 24, commonsenseqa: 12, traps_pilot: 24}
  temperature: 0.7
  max_tokens: 900
  attempts: 3
  length_tolerance: 0.10       # D3 vs D2 and correct vs wrong branch, relative length
  concurrency: 16

# S4 — annotation sheet
annotation:
  n_per_level: 30              # 4 levels x 30 = 120 messages, both annotators label all of them
  seed: 11

# Criterion 4: GPU-seconds per call on one T4, fixed before the pilot with
#   python -m scripts.estimate_budget --config configs/g1.yaml
# Unit: one generated sample (screen) or one agent turn (mad).
cost_estimate:
  tolerance: 0.30
  qwen2.5-7b: {screen_sample: 0.36, mad_call: 1.03}    # costmodel priors, Du prompts, last_round
  llama3.2-3b: {screen_sample: 0.18, mad_call: 0.53}

gate:
  min_valid_traps: 40
  min_split_half: 0.80
  min_label_accuracy: 0.85
  min_kappa: 0.70
